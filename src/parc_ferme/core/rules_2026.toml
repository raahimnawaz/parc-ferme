# 2026 Formula 1 technical rules used by the car model.
# `source` says where each number comes from. "secondary" means a press or team explainer rather than the
# FIA text; those values are the first to re-check against the published regulations.

[mass]
# "FIA" = 2026 F1 Regulations, Section C (Technical), Issue 20, 5 Aug 2026.
minimum_kg = 768.0            # car + driver, no fuel. FIA C4.1: 724 kg + Nominal Tyre Mass (set by C4.7, not
                              # published there); 768 is the press figure (McLaren, F1 Chronicle)
fuel_energy_flow_mj_per_h = 3000.0   # FIA C5.2.3 (above 10500 rpm; C5.2.4: 0.27 N + 165 below)
fuel_lhv_mj_per_kg = 39.5     # midpoint of the permitted range, FIA C16.2
fuel_lhv_min_mj_per_kg = 38.0 # FIA C16.2
fuel_lhv_max_mj_per_kg = 41.0 # FIA C16.2

[power_unit]
ice_kw = 400.0                # design target, not a rule limit. secondary: F1.com, Honda overview
mgu_k_kw = 350.0              # FIA C5.2.7 (absolute DC power, deploying or harvesting)
# Deployment against speed is FIA C5.2.8, coded in core/ers.py: 350 kW to 290 km/h, 100 kW at 340, zero from
# 345 km/h (Overtake: zero from 355). Harvesting has no speed limit.
energy_store_mj = 4.0         # state-of-charge window, FIA C5.2.9
harvest_per_lap_mj = 8.5      # FIA C5.2.10 (7 at circuits the FIA names; +0.5 under B7.2)
rev_limit_rpm = 15000.0

[dimensions]
width_m = 1.9                 # secondary: F1.com
wheelbase_m = 3.4             # maximum. secondary: F1.com

[active_aero]
# Straight mode is allowed only inside zones the FIA sets per circuit, each given here as the corners it runs
# between. "start_finish" runs from the last corner to the first.
[active_aero.zones]
15 = [["start_finish"], [3, 4], [5, 7], [9, 10]]   # Catalunya. secondary: F1.com circuit guide
