[project]
name = "parc-ferme"
version = "0.1.0"
description = "Post-session engineering debriefs for 2026 Formula 1, built on physics models checked against real telemetry."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raahim Nawaz" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "scipy>=1.12",
    "numba>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "matplotlib>=3.8"]

[project.scripts]
parc-ferme = "parc_ferme.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
parc_ferme = ["**/*.toml", "site/static/*"]
